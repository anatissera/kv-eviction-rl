# Train a single KVP agent (Qwen2-1.5B) with PPO instead of RLOO.
#
# This config is a drop-in replacement for configs/train_qwen1b.yaml that swaps the
# trainer component to PPOTrainer while keeping every other knob identical.
#
# LOCAL (Mac CPU, few samples — proves the agent learns before committing GPU time):
#   KVCOMPRESSION_DATA_ROOT=<data_root> PROJECT_ROOT=<repo_root> \
#   uv run tune run src/kvcompression/entrypoints/rl/train_agent_sampler_distributed.py \
#       --config configs/train_qwen1b_ppo.yaml distributed=False device=cpu dtype=fp32
#
# GPU SERVER (scale up):
#   uv run tune run src/kvcompression/entrypoints/rl/train_agent_sampler_distributed.py \
#       --config configs/train_qwen1b_ppo.yaml distributed=False
#
# Train a different (layer, head):  ... target_layer_idx=5 kv_head_idx=1

# Target layer and head to train. Valid for Qwen2-1.5B: layer 0..27, head 0..1.
target_layer_idx: 0
kv_head_idx: 0

sweep_name: "qwen1b_ppo_validation"

# General Configuration
seed: 42
device: "cpu"            # override to "cuda" on the server
dtype: "fp32"            # bf16 on GPU; fp32 is required on CPU
deterministic_cudnn: False
compile_agent: False
distributed: False

home_dir: ${oc.env:PROJECT_ROOT}
remote_dir: s3://kvp-local-noupload

storage_dir: ${home_dir}/agents/grouped/${sweep_name}/layer_${fmt:${target_layer_idx},06d}/kv_head_${fmt:${kv_head_idx},03d}

# Reward strategy
reward_strategy:
  _component_: kvcompression.rl.rewards.basic_strategies.FutureAttentionAucNormalizedReward

# Data Configuration (identical to train_qwen1b.yaml — reads same safetensors)
data:
  dataset:
    train:
      _component_: kvcompression.data.activations_dataset.QKVDataset
      dataset_path: "${oc.env:KVCOMPRESSION_DATA_ROOT}/gqa_safetensors/simonjegou_ruler/Qwen2-1.5B-Instruct/temperature_0.00"
      target_layer_idx: ${target_layer_idx}
      kv_head_idx: ${kv_head_idx}
      split_file: "train.txt"
      query_idx_within_group: null
      keep_dim: False
      mmap: True
      randomize_prompt_len: False
      min_prompt_len: 8
      dtype: ${dtype}

    val:
      _component_: kvcompression.data.activations_dataset.QKVDataset
      dataset_path: "${oc.env:KVCOMPRESSION_DATA_ROOT}/gqa_safetensors/simonjegou_ruler/Qwen2-1.5B-Instruct/temperature_0.00"
      target_layer_idx: ${target_layer_idx}
      kv_head_idx: ${kv_head_idx}
      split_file: "val.txt"
      query_idx_within_group: null
      keep_dim: False
      mmap: True
      randomize_prompt_len: False
      dtype: ${dtype}

# Agent Architecture (same as train_qwen1b.yaml)
agent:
  _component_: "kvcompression.rl.agents.kv_sorting_agent.KVSamplingGroupedQueryAgent"
  head_dim: 128
  max_seq_length: 6000
  mlp_hidden_size: 256
  num_mlp_layers: 2
  num_queries_per_group: 6
  pos_embedding_dim: 32
  processing_dim: 256
  query_aggregation: null
  use_kv_queries: false

# EMA Configuration
ema:
  decay: 0.99

# Oracle for reward computation
oracle:
  _component_: kvcompression.rl.rewards.oracle.Oracle

# Data Loader Configuration — small batch for local CPU run
loader:
  train:
    batch_size: 4           # use 16 on GPU (matches train_qwen1b.yaml)
    dataloader_num_workers: 0   # 0 workers for CPU; use 2 on GPU
    prefetch_factor: null       # must be null when num_workers=0
    dataloader_pin_memory: False
  eval:
    batch_size: 4
    dataloader_num_workers: 0
    prefetch_factor: null
    dataloader_pin_memory: False

# Environment Configuration (unchanged)
environment:
  train:
    _component_: kvcompression.rl.environments.kvsorting_env.KVSortingEnvironmentV2
    reward_strategy: ${reward_strategy}
    info_keys_to_log: ${trainer.info_keys_to_log}
  eval:
    _component_: kvcompression.rl.environments.kvsorting_env.KVSortingEnvironmentV2
    reward_strategy: ${reward_strategy}
    info_keys_to_log: ${trainer.info_keys_to_log}

# Trainer Configuration — PPO
trainer:
  _component_: kvcompression.rl.trainers.ppo_trainer.PPOTrainer
  # PPO knobs
  clip_epsilon: 0.2         # probability ratio clipping range [1-ε, 1+ε]
  ppo_epochs: 4             # gradient updates per collected batch
  value_coef: 0.5           # weight for value MSE loss
  value_head_dim: 128       # must match agent head_dim
  value_hidden_size: 128    # hidden size of the value MLP
  value_lr: 3.0e-4          # separate lr for the value network
  # Shared with RLOO
  entropy_coef: 0.01        # small entropy bonus to prevent premature collapse
  max_grad_norm: 5
  normalize_advantages: True
  ema_burnin_steps: 5       # short burn-in for quick local test (use 20 on GPU)
  gumbel_sampling_chunk_size: 4   # match local batch size; use 16 on GPU
  optimizer_config:
    _component_: torch.optim.AdamW
    lr: 5.0e-5
    eps: 1.0e-8
    weight_decay: 1e-3
  scheduler_config:
    _component_: kvcompression.utils.scheduler_factory.SequentialWarmupCosineScheduler
    warmup_steps: 5          # short warm-up for local test (use 20 on GPU)
    total_steps: ${training.num_epochs_or_steps}
    warmup_start_factor: 0.01
    cosine_eta_min: 1.0e-6
  info_keys_to_log: []

# Training Loop — short local run (50 steps ≈ 2-3 min on CPU with batch 4)
training:
  num_epochs_or_steps: 50   # increase to 200 on GPU (same as train_qwen1b.yaml)
  eval_interval: 10         # evaluate every 10 steps locally (50 on GPU)
  eval_episodes: null
  save_best_model: True
  storage_dir: ${storage_dir}
  save_best_on_metric: "eval_reward"

resume:
  checkpoint_interval: 25
  max_checkpoints_to_keep: 2

# Logging
logging:
  tqdm_smoothing_window: 10
  tqdm_train_metrics: ["total_loss", "episode_reward", "ppo_clip_fraction"]
  tqdm_eval_metrics: ["eval_reward", "eval_length"]

# Plotting
plotting:
  enabled: True
  smoothing_window: 10
  plot_training_curves: True
  plot_loss_curves: True
  plot_eval_metrics: True
  custom_metric_grids: []

# Final evaluation
final_evaluation:
  enabled: True
  eval_episodes: null

# WandB (disabled)
wandb:
  enabled: false
  name: "${sweep_name}_L${target_layer_idx}_H${kv_head_idx}"
  project: "kvcompression"
  entity: null

# Profiler
profiler:
  enabled: False
  cpu: True
  cuda: False
  wait_steps: 1
  warmup_steps: 1
  active_steps: 3
  num_cycles: 2
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False
