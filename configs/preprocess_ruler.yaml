# RULER Data Preprocessing Configuration
#
# This configuration preprocesses the RULER benchmark dataset to extract
# Q, K, V activations for offline training. This is the first step in the
# training pipeline.
#
# Prerequisites:
#   1. Download model weights to models/Qwen2.5-7B-Instruct/
#   2. Ensure sufficient disk space for output
#
# Run locally (single GPU, single chunk for testing):
#   uv run tune run src/kvcompression/entrypoints/datagen/unroll_and_store.py \
#       --config configs/preprocess_ruler.yaml \
#       device=cuda:0 total_num_chunks=1 current_chunk=0
#
# Run locally (8 GPUs, full dataset):
#   for i in {0..7}; do
#     uv run tune run src/kvcompression/entrypoints/datagen/unroll_and_store.py \
#         --config configs/preprocess_ruler.yaml \
#         device=cuda:$i total_num_chunks=8 current_chunk=$i &
#   done
#   wait
#
# The preprocessed data will be saved to: data/gqa_safetensors/simonjegou_ruler/...

home_dir: ${oc.env:PROJECT_ROOT}
remote_dir: s3://ml-learning-to-evict
output_dir: data/gqa_safetensors

device: cuda
dtype: bf16

seed: 1234
batch_size: 1
executor_max_workers: 1
max_new_tokens: 300
temperature: 0  # Greedy decoding for reproducibility
top_k: 300

enable_kv_cache: True
compile: False  # Compiling does not support attention wrapping

# Model configuration
model_name: Qwen2.5-7B-Instruct
model_dir: ${oc.env:PROJECT_ROOT}/models/${model_name}

model:
  _component_: torchtune.models.qwen2_5.qwen2_5_7b_instruct

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${model_dir}
  checkpoint_files: [
    model-00001-of-00004.safetensors,
    model-00002-of-00004.safetensors,
    model-00003-of-00004.safetensors,
    model-00004-of-00004.safetensors,
  ]
  output_dir: ${output_dir}
  model_type: QWEN2

tokenizer:
  _component_: torchtune.models.qwen2_5.qwen2_5_tokenizer
  path: ${model_dir}/vocab.json
  merges_file: ${model_dir}/merges.txt
  max_seq_len: null

max_context_length: null

# RULER dataset from HuggingFace
dataset_name: simonjegou/ruler
data_dir: "4096"

total_num_chunks: 1
current_chunk: 0

