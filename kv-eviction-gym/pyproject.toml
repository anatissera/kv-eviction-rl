[project]
name = "kv-eviction-gym"
version = "0.1.0"
description = "Sequential Gym environment for KV-cache eviction with MaskablePPO"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "numpy>=1.26",
    "datasets>=2.18",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
kv-train = "kv_gym.scripts.train:main"
