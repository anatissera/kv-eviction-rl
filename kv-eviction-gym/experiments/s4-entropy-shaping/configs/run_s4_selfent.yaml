# S4-proxy: per-step reward = -kl_weight * clip(H(p_evict), 0, kl_clip).
# Reference-free self-entropy of the evicted-cache next-token distribution.
# No shadow cache, NO extra forward → same speed as the baseline. Biased
# (a confidently-wrong model scores low) — this arm isolates "causal signal
# (S4-exact) vs cheap proxy".
# IDENTICAL to run_s4_kl.yaml EXCEPT kl_mode: proxy.
# Launch: python scripts/train.py --config experiments/s4-entropy-shaping/configs/run_s4_selfent.yaml --run-name s4_selfent_v1

model_name:   qwen-1.5b
device:       auto

n_examples: 1000
seed: 0

budget_min: 256
budget_max: 600
budget_min_start:    400
budget_min_end:      256
curriculum_fraction: 0.75
max_len: 620
max_new_tokens: 800

use_attention_shaping: false
attention_weight: 0.0
shaping_mode: none

hidden: 64

probe_n: 32
probe_every_n_rollouts: 15
probe_n_sinks: 4

n_parallel:      2
n_steps:         650
batch_size:      512

n_epochs:        4
gamma:           1.0
gae_lambda:      1.0
clip_range:      0.2
ent_coef:        0.01
total_timesteps: 5000000

n_sinks: 4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty: 1.0

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache

# ── S4 proxy (self-entropy) ────────────────────────────────────────────────
kl_shaping: true
kl_mode:    proxy     # H(p_evict) — reference-free, no shadow cache
kl_weight:  0.05      # calibrate via dry-run
kl_clip:    5.0
