# Tiny smoke test for the S4 pipeline — runs in a couple of minutes on the L4.
# Validates: no crash, kl_step_mean logged, shadow-cache memory sane, rewards
# include the per-step KL term. NOT a real experiment.
# Launch: python scripts/train.py --config experiments/s4-entropy-shaping/configs/smoke_s4.yaml --run-name s4_smoke

model_name:   qwen-1.5b
device:       auto

n_examples: 8
seed: 0

budget_min: 256
budget_max: 320
budget_min_start:    280
budget_min_end:      256
curriculum_fraction: 0.75
max_len: 360
max_new_tokens: 120

use_attention_shaping: false
attention_weight: 0.0
shaping_mode: none

hidden: 64

probe_n: 4
probe_every_n_rollouts: 2
probe_n_sinks: 4

n_parallel:      2
n_steps:         200
batch_size:      256

n_epochs:        2
gamma:           1.0
gae_lambda:      1.0
clip_range:      0.2
ent_coef:        0.01
total_timesteps: 6000

n_sinks: 4
n_recent: 16

length_penalty_weight: 0.5
truncation_penalty: 1.0

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache

kl_shaping: true
kl_mode:    exact
kl_weight:  0.05
kl_clip:    5.0
