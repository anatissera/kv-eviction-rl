# Training config: repeat-problem + entropy reward combined.
# Launch with: python scripts/train.py --config configs/repeat_entropy_v1.yaml --run-name repeat_entropy_v1
# Resume from best repeat_v1 checkpoint (10.5% retention at 1.42M steps):
#   python scripts/train.py --config configs/repeat_entropy_v1.yaml \
#     --run-name repeat_entropy_v1 \
#     --resume-from runs/repeat_v1/best_probe_model.zip
#
# Combines two mechanisms:
#   - repeats_per_problem=5: policy gets 5 attempts per problem before advancing
#   - entropy_reward_weight=0.001: dense per-step signal that diversifies returns
#     so explained_variance is non-NaN and value function can learn a baseline
#     (without entropy reward, all truncated episodes have identical returns → NaN EV)

model_name:   qwen-1.5b
device:       auto

n_examples: 1000
seed: 0

budget_min: 256
budget_max: 600

budget_min_start:    400
budget_min_end:      256
curriculum_fraction: 0.75
max_len: 620
max_new_tokens: 800

use_attention_shaping: false
attention_weight: 0.0
shaping_mode: none

hidden: 64

probe_n: 32
probe_every_n_rollouts: 15
probe_n_sinks: 4

n_parallel:      2
n_steps:         650
batch_size:      512

n_epochs:        4
gamma:           1.0
gae_lambda:      1.0
clip_range:      0.2
ent_coef:        0.01
total_timesteps: 5000000

n_sinks: 4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty: 1.0

# Dense per-step entropy reward: diversifies returns so value function has
# something to fit even when all episodes truncate.
entropy_reward_weight: 0.001

# 5 consecutive rollouts on the same 2 problems before advancing.
repeats_per_problem: 5

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache
