# Full overnight run: chat template + budget curriculum + protect_prompt.
#
# Builds on chat_smoke_v1 (confirmed 0% truncation, 100% correctness signal).
# Curriculum: budget_min 200→120 over 80% of training. As budget shrinks,
# more intermediate CoT tokens must be compressed into fewer KV slots.
# budget_max stays at 200 so early rollouts sample [200,200], later ones
# sample from [120,200] — increasing compression pressure gradually.
#
# All episodes share the same _shared_budget per rollout (sampled once),
# preserving the batched KV uniform-size invariant.

model_name: qwen-1.5b
device:     auto

n_examples: 1000
seed: 0

budget_min: 200
budget_max: 200

budget_min_start: 200
budget_min_end:   120
curriculum_fraction: 0.80

max_len:        250
max_new_tokens: 600

use_attention_shaping: false
attention_weight:      0.0
shaping_mode:          none

hidden: 64

probe_n:                32
probe_every_n_rollouts: 15
probe_n_sinks:          4

n_parallel:   2
n_steps:      650
batch_size:   512

n_epochs:     4
gamma:        1.0
gae_lambda:   1.0
clip_range:   0.2
ent_coef:     0.01
total_timesteps: 5000000

n_sinks:  4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty:    1.0

entropy_reward_weight: 0.001

repeats_per_problem: 5

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache

protect_prompt: true
