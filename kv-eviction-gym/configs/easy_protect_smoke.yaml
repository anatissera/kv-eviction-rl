# PHASE 0c — validation SMOKE for the unblock (post chat-template fix).
# The smoke also CALIBRATES: if truncation_rate stays high, adjust `budget_*`.
# Context: the real root cause was the RAW prompt (no chat template) → the Instruct
# model never emitted EOS → 100% truncation. Fix already on main (format_gsm8k_chat).
# With EOS working the examples terminate on their own (gen_len ~200-300), so find_easy
# and per-example budgets are NO longer needed. On top of that the batched env
# (n_parallel=2) requires a UNIFORM budget (Alex, 2026-06-29), so we use a fixed
# The smoke also CALIBRATES: if truncation_rate stays high, adjust `budget_*`.
#
# H0 goal: with a fixed budget + prompt protection, correctness FIRES:
#     truncation_rate < 1.0  AND  correct_learned > 0   (in probe_curve.csv)
# The smoke also CALIBRATES: if truncation_rate stays high, adjust `budget_*`.
#
#     rm -rf ~/.kv_eviction_cache/*

model_name: qwen-1.5b
device:     auto

# No per-example budgets: we train over ALL the examples (EOS works now).
# (per_example_budgets_path omitido a propósito.)
n_examples: 200
seed: 0

# Budget fijo compartido. Razonamiento: T≈110, gen_len≈206-302 → T+gen_len∈[311,429].
# Fixed shared budget. Reasoning: T≈110, gen_len≈206-302 → T+gen_len∈[311,429].
# example is NOT discarded and correctness can fire. ~104 eviction steps.
budget_min: 256
budget_max: 256
# No curriculum for the smoke (clean interpretation of H0). budget_*_start/end omitted.

max_len:        320     # > budget+1 (=257); cache nunca excede budget+1
max_new_tokens: 600

use_attention_shaping: false
attention_weight:      0.0
shaping_mode:          none

hidden: 64

# Probe chico y frecuente para ver señal rápido.
probe_n:                8
probe_every_n_rollouts: 2
probe_n_sinks:          4

n_parallel:   2
n_steps:      650
batch_size:   512

n_epochs:     4
gamma:        1.0
gae_lambda:   1.0
clip_range:   0.2
ent_coef:     0.01
total_timesteps: 120000

n_sinks:  4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty:    1.0

entropy_reward_weight: 0.001

repeats_per_problem: 2

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache

# ── Protección del prompt (Fase 0a) ──────────────────────────────────────────
protect_prompt: true
