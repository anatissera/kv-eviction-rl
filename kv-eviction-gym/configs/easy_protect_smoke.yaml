# FASE 0c — SMOKE de validación del desbloqueo (post chat-template fix).
#
# Contexto: la causa raíz real era el prompt CRUDO (sin chat template) → el modelo
# Instruct nunca emitía EOS → 100% truncation. Fix ya en main (format_gsm8k_chat).
# Con EOS funcionando los ejemplos terminan solos (gen_len ~200-300), así que ya NO
# hace falta find_easy ni per-example budgets. Además el batched env (n_parallel=2)
# exige budget UNIFORME (Alex, 2026-06-29), por lo que usamos un budget fijo compartido.
#
# Objetivo H0: con budget fijo + protección del prompt, correctness DISPARA:
#     truncation_rate < 1.0  Y  correct_learned > 0   (en probe_curve.csv)
# El smoke también CALIBRA: si truncation_rate queda alto, ajustar `budget_*`.
#
# PRERREQUISITO en la VM (una vez): limpiar el free-growth cache viejo (formato crudo):
#     rm -rf ~/.kv_eviction_cache/*

model_name: qwen-1.5b
device:     auto

# Sin per-example budgets: entrenamos sobre TODOS los ejemplos (EOS ya funciona).
# (per_example_budgets_path omitido a propósito.)
n_examples: 200
seed: 0

# Budget fijo compartido. Razonamiento: T≈110, gen_len≈206-302 → T+gen_len∈[311,429].
# budget=256 < T+gen_len ⇒ EOS cae en la fase de eviction (no en free-growth) ⇒ el
# ejemplo NO se descarta y la correctness puede dispararse. ~104 pasos de eviction.
budget_min: 256
budget_max: 256
# Sin curriculum para el smoke (interpretación limpia de H0). budget_*_start/end omitidos.

max_len:        320     # > budget+1 (=257); cache nunca excede budget+1
max_new_tokens: 600

use_attention_shaping: false
attention_weight:      0.0
shaping_mode:          none

hidden: 64

# Probe chico y frecuente para ver señal rápido.
probe_n:                8
probe_every_n_rollouts: 2
probe_n_sinks:          4

n_parallel:   2
n_steps:      650
batch_size:   512

n_epochs:     4
gamma:        1.0
gae_lambda:   1.0
clip_range:   0.2
ent_coef:     0.01
total_timesteps: 120000

n_sinks:  4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty:    1.0

entropy_reward_weight: 0.001

repeats_per_problem: 2

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache

# ── Protección del prompt (Fase 0a) ──────────────────────────────────────────
protect_prompt: true
