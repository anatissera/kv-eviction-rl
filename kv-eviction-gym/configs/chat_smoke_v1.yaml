# Smoke run: chat template + fixed budget, no find_easy_examples prerequisite.
#
# With the chat template (format_gsm8k_chat), Qwen2.5-1.5B-Instruct emits EOS
# naturally at gen_len ~200-400 tokens. Setting budget=200 means:
#   n_fg = 200 - T ≈ 109 tokens from free-growth (no EOS guaranteed since
#   gen_len > 109 for essentially all examples)
#   RL phase: agent evicts, model generates; EOS appears after ~gen_len-109 steps
#   → episode completes, correctness reward fires.
#
# No per_example_budgets_path: all 1000 training examples are used.
# Cache will be built from scratch (old cache was plain-text format, now invalid).
#
# This is a short smoke run (120k steps) to confirm truncation drops and
# correctness fires before committing to a full overnight run.

model_name: qwen-1.5b
device:     auto

n_examples: 1000
seed: 0

# Fixed budget: low enough that free-growth ends before gen_len for chat-format answers.
# With chat template T≈110 and gen_len≈200-400: n_fg=90, RL phase=110-290 steps.
budget_min: 200
budget_max: 200

max_len:        250
max_new_tokens: 600

use_attention_shaping: false
attention_weight:      0.0
shaping_mode:          none

hidden: 64

probe_n:                4
probe_every_n_rollouts: 2
probe_n_sinks:          4

n_parallel:   2
n_steps:      650
batch_size:   512

n_epochs:     4
gamma:        1.0
gae_lambda:   1.0
clip_range:   0.2
ent_coef:     0.01
total_timesteps: 120000

n_sinks:  4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty:    1.0

entropy_reward_weight: 0.001

repeats_per_problem: 2

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache

protect_prompt: true
