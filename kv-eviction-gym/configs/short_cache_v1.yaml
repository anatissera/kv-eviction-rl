# Training config: shortest cached examples only (v2 — fixed shared budget).
#
# Uses per_example_budgets_short.json to FILTER training to the 160 examples
# with cached_len in [263, 359]. The budget is NOT taken per-example — all
# episodes use the same shared budget (required by BatchedSharedKVVecEnv's
# batched KV invariant: all episodes must have cache_size = budget+1).
#
# Budget = 330 chosen so n_needed = 330 - T + 1 = 240 < min cached_len=263,
# guaranteeing a full cache hit for all 160 filtered examples.
#
# Flow per episode:
#   free-growth: load 239 tokens from FreeGrowthCache (no EOS, guaranteed)
#   RL phase: agent evicts, model generates; EOS appears at gen_len tokens
#   Episode completes iff gen_len <= max_new_tokens=900 and gen_len > 239.
#   The 160 short-cached examples are most likely to have gen_len in this range.
#
# Budget curriculum: budget_min 330→200, budget_max 330→280 over training.
# As budget shrinks, more context must be compressed into fewer slots.

model_name: qwen-1.5b
device:     auto

per_example_budgets_path: per_example_budgets_short.json
n_examples: 1000

seed: 0

budget_min: 330
budget_max: 330

budget_min_start: 330
budget_min_end:   200

max_len:        380
max_new_tokens: 900

use_attention_shaping: false
attention_weight:      0.0
shaping_mode:          none

hidden: 64

probe_n:                32
probe_every_n_rollouts: 15
probe_n_sinks:          4

n_parallel:   2
n_steps:      650
batch_size:   512

n_epochs:     4
gamma:        1.0
gae_lambda:   1.0
clip_range:   0.2
ent_coef:     0.01
total_timesteps: 5000000

n_sinks:  4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty:    1.0

entropy_reward_weight: 0.001

repeats_per_problem: 5

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache
