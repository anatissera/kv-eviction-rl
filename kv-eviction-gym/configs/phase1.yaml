# Phase 1: correctness reward on 200 GSM8K examples.
# Intended for GPU server (set device: cuda).

model_name:   qwen-1.5b
device:       cpu          # change to cuda on GPU server

# Data
n_examples: 200
seed: 0

# Budget sampled uniformly from [budget_min, budget_max] each episode.
# Defaults come from configs/model_defaults.json for the model_name.
# Override here only if you want a non-default range.
# budget_min: 32
# budget_max: 256
max_len: 256             # pad observations to this width
# max_new_tokens: loaded from model_defaults.json (512 for qwen-1.5b)

# Reward shaping: blend sparse correctness with dense attention alignment.
# Disable with use_attention_shaping: false if using flash_attention_2 on GPU.
use_attention_shaping: true
attention_weight: 0.3   # 0 = pure correctness, 1 = pure attention alignment

# Policy MLP hidden size
hidden: 64

# PPO hyperparameters
n_steps:         560     # 10 episodes × 56 envs
batch_size:      560
n_epochs:        4
gamma:           1.0     # no discount — every eviction shares the same terminal reward
gae_lambda:      1.0     # with gamma=1 and gae_lambda<1, later steps get higher advantage
                         # weight (0.95^k decay). lambda=1 gives identical advantages.
clip_range:      0.2
ent_coef:        0.0     # no entropy regularisation (matches the paper)
total_timesteps: 500000

save_path: checkpoints/phase1
