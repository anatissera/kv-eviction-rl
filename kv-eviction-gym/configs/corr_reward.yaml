# Training config: correctness-reward baseline (no attention shaping).
# Launch with: python scripts/train.py --config configs/corr_reward.yaml --run-name corr_reward_v1
# Intended for GPU server (set device: cuda).

model_name:   qwen-1.5b
device:       auto         # auto = CUDA on server, MPS on Apple Silicon, CPU fallback

# Data
n_examples: 1000
seed: 0

# Budget = total cache capacity (prompt + generated tokens).
# The env clamps the lower bound to max(budget_min, prompt_len) so the full
# prompt always fits without pre-eviction.  Eviction starts at decode step
# budget − prompt_len + 1 (when the cache first exceeds budget).
budget_min: 256      # used as the final (hardest) budget after curriculum completes
budget_max: 600

# Budget curriculum: linearly anneal budget_min from easy → hard over training.
# Starts near budget_max so episodes rarely truncate (policy sees real +1 reward),
# then tightens to force learning aggressive eviction.
# Set both to enable; remove/comment to disable (uses fixed budget_min above).
budget_min_start:    400   # almost no eviction → most episodes complete → real reward signal
budget_min_end:      256   # final target: ~143 tokens headroom at p90 prompt length
# curriculum_fraction: anneal completes at this fraction of total_timesteps.
# The last (1 - fraction) of training stays at budget_min_end.
# 0.75 → reaches 256 at step 3.75M; last ~174 rollouts (25%) train at hardest budget.
curriculum_fraction: 0.75
max_len: 620        # safe ceiling: cache_size ≤ budget_max+1 = 601 always
max_new_tokens: 800

# Reward shaping: blend sparse correctness with future-attention alignment.
# Runs one extra model.generate() with output_attentions=True per episode reset
# (~doubles episode wall-clock time but provides a dense signal during training).
# Requires attn_implementation='eager' (set automatically when enabled).
# Disable with use_attention_shaping: false to halve compute and use pure correctness.
use_attention_shaping: false
attention_weight: 0.0

# How the attention-alignment shaping is paid out:
#   per_step — pay it incrementally: at the step a layer-env evicts original prompt
#              position p, that env receives reward −attention_weight·importance[p].
#              Summed over the episode this equals the terminal alignment (up to a
#              per-episode constant the PPO baseline absorbs), but it is localized in
#              TIME (each eviction is credited at its own step instead of all decisions
#              sharing one terminal scalar) and PER LAYER (env l's reward reflects
#              layer l's own decision, not the 28-layer mean). Fixes the weak temporal
#              credit assignment of terminal-only shaping under gamma=1, gae_lambda=1.
#              Recommended.
#   terminal — add attention_weight·alignment once at episode end (original behavior).
#   none     — pure correctness, no shaping (same as use_attention_shaping: false).
shaping_mode: none

# Policy MLP hidden size
hidden: 64

# ── Training-time monitoring: fixed held-out eval probe ──
# Every `probe_every_n_rollouts` rollouts, run the current policy (deterministic) over the
# SAME `probe_n` held-out GSM8K test problems. Removes problem-difficulty noise so the
# correctness/behavior trajectory reflects the policy only. Logs probe/* to TensorBoard and
# <run_dir>/probe_curve.csv. Headline metric is retention = correct_learned/correct_full over
# the problems the full cache solves (intrinsically-failed problems excluded). full/random/
# kv_norm correctness are fixed anchors computed once. Set probe_n: 0 to disable.
probe_n: 32                # left-out training examples used for probe (loaded from train split)
probe_every_n_rollouts: 15 # frequency of probe evaluation
                           # probe uses same budget range as training (budget_min..budget_max),
                           # assigned per-example at init with fixed seed — variety but reproducible
probe_n_sinks: 4           # sink positions for evict_sink_frac diagnostic

# Batched env: n_parallel episodes decoded together in one forward pass.
# n_envs = n_parallel * n_layers = 2 * 28 = 56.
# EpisodeMaskablePPO collects complete episodes per rollout (variable n_steps).
# n_steps acts as a safety cap: episodes that haven't finished by then are
# bootstrapped. In normal operation (budget≤600, T≤205) all episodes finish
# well before the cap.
# n_parallel=2 (not 3): stacking peak = ready[0] + ep_list + stack + overhead
# = 3 × ~7 GB + 4 GB = 25 GB, safely within 31 GB RAM. n_parallel=3 peaked at 33 GB.
n_parallel:      2
n_steps:         650     # cap: budget_max(600) - T_min(~50) + margin
batch_size:      512

n_epochs:        4
gamma:           1.0     # no discount — every eviction shares the same terminal reward
gae_lambda:      1.0     # lambda=1 gives identical advantages for all steps (Monte Carlo)
clip_range:      0.2
ent_coef:        0.01   # small entropy bonus prevents early collapse of Discrete(512) policy
total_timesteps: 5000000

# Recency + sink protection (action-mask window; StreamingLLM\/H2O\/SnapKV standard).
# Cannot evict the first n_sinks (sinks) or last n_recent (recency window) cache slots.
n_sinks: 4
n_recent: 32

# Length / truncation reward shaping (no attention needed, works with sdpa).
# length_penalty_weight: dense signal even when correctness=0 — shorter episodes
#   are less penalized.  score -= length_penalty_weight * (step_count / max_new_tokens).
# truncation_penalty: hard hit when episode hits max_new_tokens without EOS.
#   score -= truncation_penalty  (applied on top of the length penalty).
length_penalty_weight: 0.5
truncation_penalty: 1.0

attn_implementation: sdpa

# Free-growth disk cache: stores the generated tokens from each episode's
# free-growth phase so subsequent resets skip ~300-500 decode steps and
# instead do one forward pass (prefill with prompt + cached tokens).
# Shared across training runs: set to a stable path on disk.
# Set to null or remove to disable.
free_growth_cache_dir: ~/.kv_eviction_cache
