# Phase 2: correctness reward — LLM call at episode end (expensive)
# Run on GPU after Phase 1 has converged.

model_name:   qwen-1.5b
device:       cuda
reward_mode:  correctness

# Data
n_examples: 1000
seed: 0

# Budget
budget:  32
max_len: 256

# Policy MLP
hidden: 64

# PPO hyperparameters — same as Phase 1
n_steps:         560
batch_size:      560
n_epochs:        4
gamma:           0.99
gae_lambda:      0.95
clip_range:      0.2
ent_coef:        0.0
total_timesteps: 1000000

# Load Phase 1 checkpoint to warm-start
# load_path: checkpoints/phase1
save_path: checkpoints/phase2
