# Phase 2 · E4 — CROSS-TOKEN ATTENTION policy at scale (rich features + attention).
#
# Byte-identical to e1_rich.yaml EXCEPT the policy_arch block: PerTokenAttention
# (2 layers, 4 heads) replaces the per-token-independent MLP. This is the ONLY
# candidate whose representational ceiling exceeds a per-token heuristic: it can
# reason about redundancy ACROSS the kept set ("evict A because B is kept"),
# which kv_norm and any per-token policy structurally cannot (PLAN.md §3 D3).
#
# Motivation from results (docs/runs/03-capacity-screen.md): on the E0 screen attention beat
# kv_norm (+0.19 peak, trending up at cutoff); at scale the per-token rich policy
# (s_rich) reached only PARITY with kv_norm. Hypothesis H-E4: cross-token
# reasoning is what's needed to EXCEED the heuristic, not just match it.
#
# Comparable to s_rich/s_warm: same data (n=1000, seed=0), same 32 probe anchors,
# same budget=256 → paired learned−kv_norm on one axis.

model_name: qwen-1.5b
device:     auto

n_examples: 1000
seed: 0

budget_min: 256
budget_max: 256

max_len:        288
max_new_tokens: 600

use_attention_shaping: false
attention_weight:      0.0
shaping_mode:          none

hidden: 64

probe_n:                32
probe_every_n_rollouts: 15
probe_n_sinks:          4

n_parallel:   2
n_steps:      650
batch_size:   512

n_epochs:     4
gamma:        1.0
gae_lambda:   1.0
clip_range:   0.2
ent_coef:     0.01
total_timesteps: 2000000

n_sinks:  4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty:    1.0

entropy_reward_weight: 0.001

repeats_per_problem: 5

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache

protect_prompt: false

rich_features: true

# E4: cross-token self-attention extractor (same as the e0_attn screen winner)
policy_arch: attention
attn_policy_heads: 4
attn_policy_layers: 2

# Checkpoint every ~900 wall-steps ≈ 50k timesteps (save_freq counts on_step
# calls = wall-steps; batched env = 56 timesteps/wall-step). Enables spot resume.
checkpoint_freq: 900
