# Phase 2 · E5 — GOLDEN-BC: clone the future-attention oracle, then RL.
#
# Motivation (FINDINGS §11): the golden-eviction oracle (min MAX-FUTURE
# attention, from full-cache traces) beats kv_norm by +7pp (2.8σ) while the
# best PRESENT-information heuristic (attn_cur) does not. Every online policy
# we trained (rich, warm, attention) tied at the kv_norm level — the online
# ceiling. E5 asks: how much of the +7pp can a policy capture by PREDICTING
# future attention from present features? (ForesightKV recipe, arXiv 2602.03203.)
#
# Differences vs e1_rich.yaml:
#   - n_examples: 400 (the traced prefix — golden labels exist for exactly the
#     training pool; probe = held-out [400:432]). NOTE: the probe set differs
#     from the other arms' → within-run paired gap only; the cross-arm verdict
#     comes from wide_eval.py on the shared [1032:1160] slice.
#   - golden_bc: 3000 steps of dense regression to -z(log future-attention)
#     (see warm_start.behavior_clone_golden), lr 2e-3 (the settings that made
#     the kv_norm BC take in e3).

model_name: qwen-1.5b
device:     auto

n_examples: 400
seed: 0

budget_min: 256
budget_max: 256

max_len:        288
max_new_tokens: 600

use_attention_shaping: false
attention_weight:      0.0
shaping_mode:          none

hidden: 64

probe_n:                32
probe_every_n_rollouts: 15
probe_n_sinks:          4

n_parallel:   2
n_steps:      650
batch_size:   512

n_epochs:     4
gamma:        1.0
gae_lambda:   1.0
clip_range:   0.2
ent_coef:     0.01
total_timesteps: 2000000

n_sinks:  4
n_recent: 32

length_penalty_weight: 0.5
truncation_penalty:    1.0

entropy_reward_weight: 0.001

repeats_per_problem: 5

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache

protect_prompt: false

rich_features: true

# E5: golden-BC pre-phase (traces from scripts/trace_gen.py)
golden_bc: 3000
golden_traces_dir: traces
warm_start_lr: 0.002

checkpoint_freq: 900
