# Training config: repeat-problem variant — policy gets multiple attempts per problem.
# Launch with: python scripts/train.py --config configs/repeat_v1.yaml --run-name repeat_v1
# Intended for GPU server (set device: cuda).
#
# Key difference from corr_reward.yaml: repeats_per_problem=5 keeps the same N
# problems for 5 consecutive rollouts before advancing to new ones. This gives the
# policy 5 chances to improve eviction on the same task — later attempts benefit
# from gradient updates made on earlier (usually truncated) attempts and may finally
# complete an episode, breaking the cold-start / zero-correctness-reward problem.
#
# Entropy reward disabled (entropy_reward_weight=0): it produced no measurable
# improvement in truncation rate over 2M steps in corr_reward_v1.

model_name:   qwen-1.5b
device:       auto         # auto = CUDA on server, MPS on Apple Silicon, CPU fallback

# Data
n_examples: 1000
seed: 0

# Budget = total cache capacity (prompt + generated tokens).
budget_min: 256
budget_max: 600

# Budget curriculum: linearly anneal budget_min from easy → hard over training.
budget_min_start:    400
budget_min_end:      256
curriculum_fraction: 0.75
max_len: 620
max_new_tokens: 800

# Reward shaping
use_attention_shaping: false
attention_weight: 0.0
shaping_mode: none

# Policy MLP hidden size
hidden: 64

# Probe
probe_n: 32
probe_every_n_rollouts: 15
probe_n_sinks: 4

# Batched env
n_parallel:      2
n_steps:         650
batch_size:      512

n_epochs:        4
gamma:           1.0
gae_lambda:      1.0
clip_range:      0.2
ent_coef:        0.01
total_timesteps: 5000000

# Eviction constraints
n_sinks: 4
n_recent: 32

# Length / truncation reward
length_penalty_weight: 0.5
truncation_penalty: 1.0

# Entropy reward disabled — no benefit observed in corr_reward_v1 over 2M steps.
entropy_reward_weight: 0.0

# Repeat-problem: train on the same N problems for this many consecutive rollouts.
# After repeats_per_problem rollouts, advance to fresh problems.
# The free-growth cache makes repeat resets fast (one prefill instead of ~300 decode steps).
repeats_per_problem: 5

attn_implementation: sdpa

free_growth_cache_dir: ~/.kv_eviction_cache
