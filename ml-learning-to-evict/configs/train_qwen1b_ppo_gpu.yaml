# PPO agent training — GPU config for Qwen2-1.5B-Instruct.
#
# Mirrors train_qwen1b.yaml (the paper's RLOO config) in every shared
# hyperparameter so that RLOO vs PPO comparisons are fair.  Only the
# trainer component and PPO-specific knobs differ.
#
# Run (single GPU):
#   uv run tune run src/kvcompression/entrypoints/rl/train_agent_sampler_distributed.py \
#       --config configs/train_qwen1b_ppo_gpu.yaml distributed=False \
#       target_layer_idx=0 kv_head_idx=0
#
# Train a different (layer, head):  ... target_layer_idx=5 kv_head_idx=1

target_layer_idx: 0
kv_head_idx: 0

sweep_name: "qwen1b_ppo"

seed: 42
device: "cuda"
dtype: "bf16"
deterministic_cudnn: False
compile_agent: False
distributed: False

home_dir: ${oc.env:PROJECT_ROOT}
remote_dir: s3://kvp-local-noupload
storage_dir: ${home_dir}/agents/grouped/${sweep_name}/layer_${fmt:${target_layer_idx},06d}/kv_head_${fmt:${kv_head_idx},03d}

reward_strategy:
  _component_: kvcompression.rl.rewards.basic_strategies.FutureAttentionAucNormalizedReward

data:
  dataset:
    train:
      _component_: kvcompression.data.activations_dataset.QKVDataset
      dataset_path: "${oc.env:KVCOMPRESSION_DATA_ROOT}/gqa_safetensors/simonjegou_ruler/Qwen2-1.5B-Instruct/temperature_0.00"
      target_layer_idx: ${target_layer_idx}
      kv_head_idx: ${kv_head_idx}
      split_file: "train.txt"
      query_idx_within_group: null
      keep_dim: False
      mmap: True
      randomize_prompt_len: False
      min_prompt_len: 8
      dtype: ${dtype}
    val:
      _component_: kvcompression.data.activations_dataset.QKVDataset
      dataset_path: "${oc.env:KVCOMPRESSION_DATA_ROOT}/gqa_safetensors/simonjegou_ruler/Qwen2-1.5B-Instruct/temperature_0.00"
      target_layer_idx: ${target_layer_idx}
      kv_head_idx: ${kv_head_idx}
      split_file: "val.txt"
      query_idx_within_group: null
      keep_dim: False
      mmap: True
      randomize_prompt_len: False
      dtype: ${dtype}

agent:
  _component_: "kvcompression.rl.agents.kv_sorting_agent.KVSamplingGroupedQueryAgent"
  head_dim: 128
  max_seq_length: 6000
  mlp_hidden_size: 256
  num_mlp_layers: 2
  num_queries_per_group: 6
  pos_embedding_dim: 32
  processing_dim: 256
  query_aggregation: null
  use_kv_queries: false

ema:
  decay: 0.99

oracle:
  _component_: kvcompression.rl.rewards.oracle.Oracle

# Identical to train_qwen1b.yaml
loader:
  train:
    batch_size: 16
    dataloader_num_workers: 2
    prefetch_factor: 2
    dataloader_pin_memory: True
  eval:
    batch_size: 8
    dataloader_num_workers: 2
    prefetch_factor: 2
    dataloader_pin_memory: True

environment:
  train:
    _component_: kvcompression.rl.environments.kvsorting_env.KVSortingEnvironmentV2
    reward_strategy: ${reward_strategy}
    info_keys_to_log: ${trainer.info_keys_to_log}
  eval:
    _component_: kvcompression.rl.environments.kvsorting_env.KVSortingEnvironmentV2
    reward_strategy: ${reward_strategy}
    info_keys_to_log: ${trainer.info_keys_to_log}

trainer:
  _component_: kvcompression.rl.trainers.ppo_trainer.PPOTrainer

  # ── PPO-specific ──────────────────────────────────────────────────────────
  clip_epsilon: 0.2       # standard PPO clipping range
  ppo_epochs: 4           # gradient updates per collected batch
  value_coef: 0.5         # weight of critic MSE loss relative to policy loss
  value_head_dim: 128     # must match agent head_dim
  value_hidden_size: 128
  value_lr: 3.0e-4        # critic uses a higher lr than the policy (common practice)

  # ── Shared with RLOO — kept identical to train_qwen1b.yaml for fair comparison ──
  entropy_coef: 0         # paper uses 0; set to 0.01 if policy collapses early
  max_grad_norm: 5
  normalize_advantages: True
  ema_burnin_steps: 20
  gumbel_sampling_chunk_size: 16

  optimizer_config:
    _component_: torch.optim.AdamW
    lr: 5.0e-5
    eps: 1.0e-8
    weight_decay: 1e-3
  scheduler_config:
    _component_: kvcompression.utils.scheduler_factory.SequentialWarmupCosineScheduler
    warmup_steps: 20
    total_steps: ${training.num_epochs_or_steps}
    warmup_start_factor: 0.01
    cosine_eta_min: 1.0e-6

  info_keys_to_log: []

# Identical to train_qwen1b.yaml
training:
  num_epochs_or_steps: 200
  eval_interval: 50
  eval_episodes: null
  save_best_model: True
  storage_dir: ${storage_dir}
  save_best_on_metric: "eval_reward"

resume:
  checkpoint_interval: 50
  max_checkpoints_to_keep: 2

logging:
  tqdm_smoothing_window: 20
  tqdm_train_metrics: ["ppo_policy_loss", "episode_reward", "ppo_clip_fraction"]
  tqdm_eval_metrics: ["eval_reward", "eval_length"]

plotting:
  enabled: True
  smoothing_window: 20
  plot_training_curves: True
  plot_loss_curves: True
  plot_eval_metrics: True
  custom_metric_grids: []

final_evaluation:
  enabled: True
  eval_episodes: null

wandb:
  enabled: false
  name: "${sweep_name}_L${target_layer_idx}_H${kv_head_idx}"
  project: "kvcompression"
  entity: null

profiler:
  enabled: False
  cpu: True
  cuda: True
  wait_steps: 1
  warmup_steps: 1
  active_steps: 3
  num_cycles: 2
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False
